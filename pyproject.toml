[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okf-agent"
version = "0.2.0"
description = "Python compatibility library for the Rust OKF Agent CLI"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
treesitter = ["tree-sitter>=0.22"]

[tool.setuptools.packages.find]
include = ["okf_agent*"]

[tool.setuptools.package-data]
okf_agent = [
    "templates/workflows/*.json",
    "templates/workflows/*.md",
    "templates/workflows/profiles/*.md",
    "templates/workflows/roles/*.md",
]
