rules:
  - from: "crates/okf-domain"
    disallow:
      - "okf_application"
      - "okf_adapter_fs"
      - "okf_adapter_git"
      - "okf_adapter_mcp"
      - "okf_adapter_sqlite"
      - "okf_cli"
  - from: "crates/okf-application"
    disallow:
      - "okf_adapter_fs"
      - "okf_adapter_git"
      - "okf_adapter_mcp"
      - "okf_adapter_sqlite"
      - "okf_cli"
  - from: "crates/okf-adapter"
    disallow:
      - "okf_cli"

doc_mappings:
  - code: "crates/okf-domain/**"
    doc: ".okf/application/overview.md"
  - code: "crates/okf-application/**"
    doc: ".okf/application/overview.md"
  - code: "crates/okf-adapter-sqlite/**"
    doc: ".okf/architecture/index.md"
  - code: "crates/okf-cli/**"
    doc: ".okf/operations/development.md"
