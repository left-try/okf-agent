[workspace]
members = [
    "crates/okf-domain",
    "crates/okf-application",
    "crates/okf-adapter-fs",
    "crates/okf-adapter-sqlite",
    "crates/okf-adapter-git",
    "crates/okf-adapter-mcp",
    "crates/okf-cli",
]
default-members = ["crates/okf-cli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
notify = "8.2"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
walkdir = "2.5"
